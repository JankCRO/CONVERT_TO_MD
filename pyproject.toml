[project]
name = "convert-to-md"
version = "1.0.0"
description = "Herramienta de escritorio 100% local para convertir documentos (.pdf, .docx, .html, .txt) a Markdown limpio con YAML Frontmatter optimizado para LLMs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
    "magika>=0.6.0",
    "markitdown[pdf]>=0.1.9",
    "pdfminer-six>=20260107",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "tkinterdnd2>=0.6.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
